<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { border: 1px solid #51667c; border-radius: 14px; padding: 20px; background: #1a2a3d; }
    h2 { font-size: 21px; margin: 0 0 12px; }
    .auth p { margin: 8px 0 16px; }
    label { display: block; margin: 14px 0 6px; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #7f94ab; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    textarea { min-height: 140px; resize: vertical; }
    .editor { margin-top: 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .secondary { background: #bfd0e5; }
    .danger { background: #ffe3e8; }
    li span { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
    button { margin-top: 18px; padding: 12px 20px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 3px solid #ffe3a5; outline-offset: 3px; }
    #auth-error { color: #ffe3e8; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 내 자료실</div>
    <h1>내 자료실</h1>
    <p>로그인해 실습용 가상 메모를 관리합니다.</p>
    <div class="notice">이 자료실의 메모는 모두 실습용 가상 자료입니다.</div>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 로그인</h2>
      <p id="auth-status" role="status" aria-live="polite">로그인 연결 확인 중</p>
      <form id="login-form" aria-describedby="auth-error" aria-busy="true">
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required disabled>
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required disabled>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden disabled>로그아웃</button>
      <p id="auth-error" role="alert" hidden></p>
    </section>
    <section id="note-editor" class="auth editor" aria-labelledby="note-heading" hidden>
      <h2 id="note-heading">가상 메모 추가</h2>
      <form id="note-form" aria-describedby="note-status">
        <label for="note-title">제목</label>
        <input id="note-title" name="title" maxlength="200" required>
        <label for="note-body">내용</label>
        <textarea id="note-body" name="body" maxlength="10000" required></textarea>
        <div class="actions">
          <button id="note-save" type="submit">추가</button>
          <button id="note-cancel" class="secondary" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p id="note-status" role="status" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인 후 자료를 볼 수 있습니다.</li></ul>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/auth-ui.js"></script>
</body>
</html>
